databaseChangeLog:
  - changeSet:
      id: 004-create-documents-table
      author: docmind
      context: test, prod
      comment: Documents table — tracks uploaded files and processing status
      changes:
        - createTable:
            tableName: documents
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: org_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_documents_org
                    references: organizations(id)
              - column:
                  name: filename
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: original_filename
                  type: varchar(500)
              - column:
                  name: file_type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: file_size_bytes
                  type: bigint
              - column:
                  name: storage_path
                  type: varchar(1000)
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: PENDING
              - column:
                  name: chunk_count
                  type: integer
                  defaultValue: 0
              - column:
                  name: error_message
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: now()
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: now()
